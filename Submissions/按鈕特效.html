<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS 液態玻璃按鈕 - 俐落柔和版</title>
  <style>
    :root {
      --glass-blur: blur(32px) saturate(190%);
      --glass-border: rgba(255, 255, 255, 0.32);
      --glass-glow: rgba(255, 255, 255, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #020408;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 50% 35%, #131733 0%, #030408 100%);
      pointer-events: none;
    }

    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.6;
    }
    .orb-1 { width: 480px; height: 480px; background: #00d2ff; top: 12%; left: 20%; }
    .orb-2 { width: 450px; height: 450px; background: #ff007f; bottom: 18%; right: 20%; }

    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    
    .spring-glass-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 22px 58px;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.11);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      transform-origin: center center;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.35),
        inset 0 1.5px 2px var(--glass-glow),
        inset 0 -1.5px 2px rgba(0, 0, 0, 0.25);
      will-change: transform, box-shadow, filter;
    }

    .spring-glass-btn svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      pointer-events: none;
    }

    .spring-glass-btn span {
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .tip {
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.86rem;
      letter-spacing: -0.2px;
    }
  </style>
</head>
<body>

  <div class="ambient-canvas">
    <div class="liquid-orb orb-1"></div>
    <div class="liquid-orb orb-2"></div>
  </div>

  <div class="stage">
    <button class="spring-glass-btn" id="btn">
      <svg viewBox="0 0 24 24">
        <polygon points="6 3 20 12 6 21 6 3"></polygon>
      </svg>
      <span>開始體驗</span>
    </button>
    <div class="tip">即按即響應 · 柔潤微彈回正</div>
  </div>

  <script>
    const btn = document.getElementById('btn');

    
    const spring = {
      current: 1.0,
      target: 1.0,
      velocity: 0.0,
      stiffness: 260, 
      damping: 19,    
      mass: 0.9       
    };

    let isPhysicallyPressed = false;
    let pressStartTime = 0;
    const MIN_HOLD_MS = 60; 
    let releaseTimer = null;

    let lastTime = performance.now();
    let animId = null;

    function tick(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.032);
      lastTime = now;

      
      const displacement = spring.current - spring.target;
      const springForce = -spring.stiffness * displacement;
      const dampingForce = -spring.damping * spring.velocity;
      const acceleration = (springForce + dampingForce) / spring.mass;

      spring.velocity += acceleration * dt;
      spring.current += spring.velocity * dt;

      
      const scaleBase = spring.current;
      const microWobble = spring.velocity * 0.012; 
      const scaleX = scaleBase + microWobble;
      const scaleY = scaleBase - microWobble;

      btn.style.transform = `scale(${scaleX}, ${scaleY})`;
      
      const progress = Math.max(0, (scaleBase - 1.0) / 0.10);
      btn.style.filter = `brightness(${1 + progress * 0.14})`;
      btn.style.boxShadow = `
        0 ${20 + progress * 14}px ${40 + progress * 18}px rgba(0, 0, 0, ${0.35 + progress * 0.15}),
        inset 0 ${1.5 + progress * 0.8}px 2px rgba(255, 255, 255, ${0.7 + progress * 0.2}),
        inset 0 -1.5px 2px rgba(0, 0, 0, 0.25)
      `;

      
      const isResting = Math.abs(spring.velocity) < 0.0006 && Math.abs(displacement) < 0.0006;
      if (!isResting || isPhysicallyPressed || releaseTimer !== null) {
        animId = requestAnimationFrame(tick);
      } else {
        spring.current = spring.target;
        btn.style.transform = `scale(${spring.target})`;
        btn.style.filter = 'brightness(1)';
        animId = null;
      }
    }

    function wakeSpring() {
      lastTime = performance.now();
      if (!animId) {
        animId = requestAnimationFrame(tick);
      }
    }

    function executeRelease() {
      releaseTimer = null;
      spring.target = 1.0;
      wakeSpring();
    }

    function onPress(e) {
      if (isPhysicallyPressed) return;
      isPhysicallyPressed = true;
      pressStartTime = performance.now();

      if (releaseTimer) {
        clearTimeout(releaseTimer);
        releaseTimer = null;
      }

      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      spring.target = 1.10; 
      wakeSpring();
    }

    function onRelease(e) {
      if (!isPhysicallyPressed) return;
      isPhysicallyPressed = false;
      try { btn.releasePointerCapture(e.pointerId); } catch (_) {}

      const elapsed = performance.now() - pressStartTime;
      const remaining = MIN_HOLD_MS - elapsed;

      if (remaining > 0) {
        releaseTimer = setTimeout(executeRelease, remaining);
      } else {
        executeRelease();
      }
    }

    btn.addEventListener('pointerdown', onPress);
    btn.addEventListener('pointerup', onRelease);
    btn.addEventListener('pointercancel', onRelease);
  </script>
</body>
</html>
