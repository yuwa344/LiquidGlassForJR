<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>導航欄 | 毛玻璃 + 漸變</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e, #1a1a2e);
    background-size: 300% 300%;
    animation: bgShift 20s ease infinite;
    color: #fff;
    overflow-x: hidden;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }
  .blob-1 { width: 400px; height: 400px; background: #ff2e93; top: -120px; right: -80px; }
  .blob-2 { width: 350px; height: 350px; background: #00c6ff; bottom: -100px; left: -80px; }
  .blob-3 { width: 280px; height: 280px; background: #7c3aed; top: 40%; left: 50%; transform: translateX(-50%); }

  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 72px;
    background: rgba(255, 255, 255, 0.06);
    border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, #ff2e93, #7c3aed 40%, #00c6ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: logoFlow 4s linear infinite;
    cursor: default;
    user-select: none;
  }
  @keyframes logoFlow {
    to { background-position: 200% center; }
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
  }
  .nav-links a {
    position: relative;
    display: inline-block;
    padding: 8px 16px;
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.8);
    text-decoration: none;
    border-radius: 50px;
    transition: color 0.3s ease, background 0.3s ease;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 4px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, #ff2e93, #7c3aed, #00c6ff);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .nav-links a:hover {
    color: #fff;
    background: rgba(255,255,255,0.08);
  }
  .nav-links a:hover::after {
    transform: scaleX(1);
  }
  .nav-cta {
    padding: 9px 24px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(120deg, #ff2e93, #7c3aed, #00c6ff);
    background-size: 200% auto;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    animation: btnFlow 5s linear infinite;
    box-shadow: 0 4px 18px rgba(124,58,237,0.4);
  }
  @keyframes btnFlow {
    to { background-position: 200% center; }
  }
  .nav-cta:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 8px 28px rgba(124,58,237,0.6);
  }
  .nav-cta:active { transform: translateY(0) scale(0.98); }

  .menu-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    z-index: 101;
  }
  .menu-toggle span {
    display: block;
    width: 26px;
    height: 2px;
    background: #fff;
    border-radius: 2px;
    transition: all 0.3s ease;
  }

  @media (max-width: 768px) {
    .navbar { padding: 0 20px; }
    .nav-links {
      position: fixed;
      top: 72px;
      left: 0;
      right: 0;
      flex-direction: column;
      gap: 0;
      padding: 20px 0;
      background: rgba(20, 15, 40, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,0.15);
      transform: translateY(-120%);
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      pointer-events: none;
      opacity: 0;
    }
    .nav-links.active {
      transform: translateY(0);
      pointer-events: auto;
      opacity: 1;
    }
    .nav-links a {
      padding: 14px 24px;
      border-radius: 0;
      width: 100%;
      text-align: center;
      font-size: 16px;
    }
    .nav-links a::after { left: 30%; right: 30%; bottom: 8px; }
    .nav-cta { display: none; }
    .menu-toggle { display: flex; }
    .menu-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .menu-toggle.active span:nth-child(2) { opacity: 0; }
    .menu-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
  }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .navbar { background: rgba(20, 15, 40, 0.9); }
  }

  .page-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 72px);
    padding: 40px 24px;
    text-align: center;
  }
  .page-content h1 {
    font-size: clamp(32px, 7vw, 56px);
    font-weight: 800;
    margin-bottom: 18px;
    background: linear-gradient(90deg, #fff, #ffd6f5, #a5e8ff, #c4b5fd, #fff);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: 300% center; } }
  .page-content p {
    max-width: 520px;
    line-height: 1.8;
    color: rgba(255,255,255,0.7);
    font-size: 16px;
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <nav class="navbar">
    <div class="logo">✦ GlassNav</div>
    <ul class="nav-links" id="navLinks">
      <li><a href="#">首頁</a></li>
      <li><a href="#">功能</a></li>
      <li><a href="#">範例</a></li>
      <li><a href="#">關於</a></li>
    </ul>
    <button class="nav-cta">立即開始</button>
    <button class="menu-toggle" id="menuToggle" aria-label="選單">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <section class="page-content">
    <h1>毛玻璃導航欄</h1>
    <p>固定頂部、背景模糊、漸變流動。在手機上點擊右側選單圖示展開導航連結。</p>
  </section>

  <script>
    const toggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('active');
      navLinks.classList.toggle('active');
    });
  </script>
</body>
</html>
